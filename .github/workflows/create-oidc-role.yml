name: Create OIDC Role (CloudFormation)

on:
  workflow_dispatch:
    inputs:
      stack-name:
        description: "CloudFormation stack name (optional)"
        required: false
        default: "personal-budget-oidc-role"
      github-ref:
        description: "Git ref to allow (e.g. refs/heads/main)"
        required: false
        default: "refs/heads/main"

jobs:
  deploy-role:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ADMIN_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ADMIN_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy OIDC role via CloudFormation
        run: |
          set -euo pipefail
          REPO_FULL="${GITHUB_REPOSITORY}"
          OWNER="${REPO_FULL%%/*}"
          REPO="${REPO_FULL##*/}"
          STACK_NAME="${{ github.event.inputs.stack-name }}"
          if [ -z "$STACK_NAME" ]; then STACK_NAME="personal-budget-oidc-role"; fi
          GITHUB_REF_INPUT="${{ github.event.inputs.github-ref }}"
          if [ -z "$GITHUB_REF_INPUT" ]; then GITHUB_REF_INPUT="refs/heads/main"; fi

          echo "Deploying CloudFormation stack $STACK_NAME for repo $OWNER/$REPO (allowed ref=$GITHUB_REF_INPUT)"

          aws cloudformation deploy \
            --template-file infra/oidc-role.yml \
            --stack-name "$STACK_NAME" \
            --parameter-overrides GitHubOwner="$OWNER" GitHubRepo="$REPO" GitHubRef="$GITHUB_REF_INPUT" \
            --capabilities CAPABILITY_NAMED_IAM

      - name: Show created Role ARN
        run: |
          STACK_NAME="${{ github.event.inputs.stack-name }}"
          if [ -z "$STACK_NAME" ]; then STACK_NAME="personal-budget-oidc-role"; fi
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='RoleArn'].OutputValue" --output text
