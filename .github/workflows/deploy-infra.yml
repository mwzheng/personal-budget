name: Deploy Infrastructure (Serverless)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy'
        required: false
        default: 'dev'

jobs:
  deploy:
    name: Deploy infra
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      STAGE: ${{ github.event.inputs.stage || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Serverless Framework
        run: npm install -g serverless@3

      - name: Deploy with Serverless
        run: |
          cd infra
          serverless deploy --stage ${{ env.STAGE }} --region ${{ env.AWS_REGION }}

# Notes:
# - Create a repository secret named AWS_OIDC_ROLE_ARN containing the role ARN created in the target AWS account.
# - Alternatively, replace role-to-assume with a hard-coded role ARN (not recommended). Ensure the IAM role trust policy restricts the repo/branch.
# - This workflow runs on pushes to main and can be triggered manually via "Run workflow".
